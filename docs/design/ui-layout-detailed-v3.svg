  <text x="950" y="35" text-anchor="middle" class="title">C语言考试系统 · 双端 UI 详细设计稿 v3</text>
  <text x="950" y="60" text-anchor="middle" class="small">PC 基准：2560×1440　|　手机基准：1080×2160 固定竖屏　|　其他分辨率等比缩放 + 安全边距</text>

  <!-- scaling rule -->
  <rect x="55" y="85" width="1790" height="78" rx="10" class="note"/>
  <text x="80" y="115" class="label">适配规则</text><text x="175" y="115" class="text">以基准画布设计，不拉伸 UI；窄屏使用统一缩放比例并保留最小边距，宽屏增加留白或扩展内容区。</text>
  <text x="175" y="140" class="small">PC：导航/内容/详情按锚点布局；手机：SafeArea + 单列 ScrollRect；弹窗、题号抽屉和代码编辑器不超出可用区域。</text>

